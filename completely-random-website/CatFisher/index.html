<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Viewer</title>
<style>
  :root {
    --bg: #fafafa;
    --text: #222;
    --panel-bg: #fff;
    --panel-border: #ccc;
    --heading-color: #555;
    --btn-bg: #eee;
    --btn-bg-hover: #e0e0e0;
    --btn-border: #999;
    --img-border: #ccc;
  }

  body.dark-mode {
    --bg: #181818;
    --text: #eee;
    --panel-bg: #242424;
    --panel-border: #444;
    --heading-color: #aaa;
    --btn-bg: #333;
    --btn-bg-hover: #3f3f3f;
    --btn-border: #666;
    --img-border: #444;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: Verdana, sans-serif;
    padding: 24px;
    box-sizing: border-box;
    transition: background 0.2s, color 0.2s;
  }

  #cat-photo {
    max-width: 65vw;
    max-height: 80vh;
    border: 4px solid var(--img-border);
  }

  #panel {
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .section {
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 12px;
    background: var(--panel-bg);
    transition: background 0.2s, border-color 0.2s;
  }

  .section h3 {
    margin: 0 0 10px 0;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--heading-color);
  }

  #reroll-btn {
    width: 100%;
    padding: 8px 0;
    font-size: 0.9rem;
    cursor: pointer;
    border: 1px solid var(--btn-border);
    border-radius: 4px;
    background: var(--btn-bg);
    color: var(--text);
  }
  #reroll-btn:hover {
    background: var(--btn-bg-hover);
  }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .switch-row:last-child {
    margin-bottom: 0;
  }

  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider-track {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #ccc;
    border-radius: 22px;
    transition: 0.2s;
  }
  .slider-track:before {
    content: "";
    position: absolute;
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .slider-track {
    background-color: #4caf50;
  }
  input:checked + .slider-track:before {
    transform: translateX(18px);
  }

  #interval-row {
    font-size: 0.8rem;
    color: var(--heading-color);
  }

  #interval-slider {
    width: 100%;
  }

  .radio-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 0.85rem;
  }
  .radio-row:last-child {
    margin-bottom: 0;
  }
  .radio-row input {
    margin: 0;
  }

  body.hide-active .section:not(.main-section) {
    display: none;
  }
  body.hide-active .main-section .hideable {
    display: none;
  }
</style>
</head>
<body>

<img id="cat-photo" src="" alt="A random cat">

<div id="panel">
  <div class="section main-section">
    <h3>Main</h3>
    <div class="hideable">
      <button id="reroll-btn" type="button">Reroll</button>
    </div>
    <div class="switch-row hideable" style="margin-top: 12px;">
      <span>L/D</span>
      <label class="switch">
        <input type="checkbox" id="theme-toggle">
        <span class="slider-track"></span>
      </label>
    </div>
    <div class="switch-row" style="margin-top: 12px;">
      <span>Hide</span>
      <label class="switch">
        <input type="checkbox" id="hide-toggle">
        <span class="slider-track"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <h3>Timed</h3>
    <div class="switch-row">
      <span>Enable</span>
      <label class="switch">
        <input type="checkbox" id="enable-toggle" checked>
        <span class="slider-track"></span>
      </label>
    </div>
    <div id="interval-row">
      Interval: <span id="interval-value">8</span>s
      <input type="range" id="interval-slider" min="1" max="15" value="8" step="1">
    </div>
  </div>

  <div class="section">
    <h3>Source</h3>
    <div class="radio-row">
      <input type="radio" name="source" id="source-catapi" value="catapi" checked>
      <label for="source-catapi">TheCatAPI</label>
    </div>
    <div class="radio-row">
      <input type="radio" name="source" id="source-cataas" value="cataas">
      <label for="source-cataas">Cataas</label>
    </div>
    <div class="radio-row">
      <input type="radio" name="source" id="source-randomcat" value="randomcat">
      <label for="source-randomcat">RandomCatApi</label>
    </div>
  </div>
</div>

<script>
  var catImg = document.getElementById("cat-photo");
  var rerollBtn = document.getElementById("reroll-btn");
  var enableToggle = document.getElementById("enable-toggle");
  var intervalSlider = document.getElementById("interval-slider");
  var intervalValue = document.getElementById("interval-value");
  var themeToggle = document.getElementById("theme-toggle");
  var hideToggle = document.getElementById("hide-toggle");

  var timerId = null;

  function loadNewCat() {
    fetch("https://api.thecatapi.com/v1/images/search?_=" + Date.now())
      .then(function (response) {
        return response.json();
      })
      .then(function (result) {
        catImg.src = result[0].url;
      })
      .catch(function (err) {
        console.log("Couldn't load a cat:", err);
      });
  }

  function stopTimer() {
    if (timerId !== null) {
      clearInterval(timerId);
      timerId = null;
    }
  }

  function startTimer() {
    stopTimer();
    var seconds = parseInt(intervalSlider.value, 10);
    timerId = setInterval(loadNewCat, seconds * 1000);
  }

  rerollBtn.addEventListener("click", loadNewCat);

  enableToggle.addEventListener("change", function () {
    if (enableToggle.checked) {
      startTimer();
    } else {
      stopTimer();
    }
  });

  intervalSlider.addEventListener("input", function () {
    intervalValue.textContent = intervalSlider.value;
    if (enableToggle.checked) {
      startTimer();
    }
  });

  themeToggle.addEventListener("change", function () {
    document.body.classList.toggle("dark-mode", themeToggle.checked);
  });

  hideToggle.addEventListener("change", function () {
    document.body.classList.toggle("hide-active", hideToggle.checked);
  });

  loadNewCat();
  if (enableToggle.checked) {
    startTimer();
  }
</script>

</body>
</html>
