<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Drive Suite</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Drive Suite</a>
      <div class="d-flex align-items-center ms-auto" id="user-area">
        <a href="/api/auth" id="signin-btn" class="btn btn-outline-light">Sign in with Google</a>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row mb-3">
      <div class="col-12 col-md-6">
        <div class="input-group">
          <input id="search-input" type="search" class="form-control" placeholder="Search files by name or content...">
          <button id="filter-btn" class="btn btn-outline-secondary" type="button"><i class="fa fa-filter"></i> Filter</button>
          <button id="sort-btn" class="btn btn-outline-secondary" type="button"><i class="fa fa-sort"></i> Sort</button>
        </div>
      </div>
      <div class="col-12 col-md-6 text-end mt-2 mt-md-0" id="summary"></div>
    </div>

    <div id="filter-menu" class="card p-3 mb-3 d-none"> ... </div>
    <div id="sort-menu" class="card p-3 mb-3 d-none"> ... </div>

    <div id="files" class="row row-cols-1 row-cols-md-2 g-3"></div>
    <div id="loading" class="text-center my-3 d-none">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
