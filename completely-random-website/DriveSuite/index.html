<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Drive Suite</title>

  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Optional icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Drive Suite</a>
      <div class="d-flex align-items-center ms-auto" id="user-area">
        <!-- Filled by JS -->
        <a href="/auth" id="signin-btn" class="btn btn-outline-light">Sign in with Google</a>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row mb-3">
      <div class="col-12 col-md-6">
        <div class="input-group">
          <input id="search-input" type="search" class="form-control" placeholder="Search files by name or content...">
          <button id="filter-btn" class="btn btn-outline-secondary" type="button"><i class="fa fa-filter"></i> Filter</button>
          <button id="sort-btn" class="btn btn-outline-secondary" type="button"><i class="fa fa-sort"></i> Sort</button>
        </div>
      </div>
      <div class="col-12 col-md-6 text-end mt-2 mt-md-0" id="summary">
        <!-- Summary / user info -->
      </div>
    </div>

    <!-- Filter menu -->
    <div id="filter-menu" class="card p-3 mb-3 d-none">
      <div class="row gx-2 gy-2 align-items-center">
        <div class="col-auto">
          <label class="form-label mb-0">Type</label>
          <select id="filter-type" class="form-select">
            <option value="all">All</option>
            <option value="documents">Google Docs</option>
            <option value="spreadsheets">Sheets</option>
            <option value="presentations">Slides</option>
            <option value="pdfs">PDF</option>
            <option value="images">Images</option>
            <option value="folders">Folders</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="form-label mb-0">Page size</label>
          <select id="page-size" class="form-select">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
          </select>
        </div>
        <div class="col">
          <button id="apply-filter" class="btn btn-primary mt-2">Apply</button>
          <button id="clear-filter" class="btn btn-link mt-2">Clear</button>
        </div>
      </div>
    </div>

    <!-- Sort menu -->
    <div id="sort-menu" class="card p-3 mb-3 d-none">
      <div class="row gx-2 gy-2 align-items-center">
        <div class="col-auto">
          <label class="form-label mb-0">Sort by</label>
          <select id="sort-by" class="form-select">
            <option value="name">Name</option>
            <option value="modifiedTime" selected>Last modified</option>
            <option value="createdTime">Created</option>
            <option value="size">Size</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="form-label mb-0">Direction</label>
          <select id="sort-dir" class="form-select">
            <option value="desc" selected>Descending</option>
            <option value="asc">Ascending</option>
          </select>
        </div>
        <div class="col">
          <button id="apply-sort" class="btn btn-primary mt-2">Apply</button>
        </div>
      </div>
    </div>

    <div id="files" class="row row-cols-1 row-cols-md-2 g-3">
      <!-- File cards filled by JS -->
    </div>

    <div id="loading" class="text-center my-3 d-none">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>
  </main>

  <!-- Bootstrap JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
